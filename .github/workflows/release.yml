name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check that the tag matches versionName
        run: |
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME} in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOCIALBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing SOCIALBLOCK_KEYSTORE_BASE64 secret. See the Releases section in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SOCIALBLOCK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SOCIALBLOCK_KEYSTORE_PASSWORD: ${{ secrets.SOCIALBLOCK_KEYSTORE_PASSWORD }}
          SOCIALBLOCK_KEY_ALIAS: ${{ secrets.SOCIALBLOCK_KEY_ALIAS }}
          SOCIALBLOCK_KEY_PASSWORD: ${{ secrets.SOCIALBLOCK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="SocialBlock-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "SocialBlock ${VERSION_NAME}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
